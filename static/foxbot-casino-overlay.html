<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoxBot Casino Commands Ticker</title>
<!--
  FoxBot Casino - OBS Browser Source ticker (static, no API calls).
  URL:  https://foxbot-ai-chatbot.onrender.com/static/foxbot-casino-overlay.html
  OBS:  Browser Source, Width 1920, Height 1080. Background is transparent.
  Same style as crypt0k1ng_obs_commands_ticker_v2.html.

  Optional query params:
    ?speed=115   scroll speed in pixels per second (default 115)
    ?bottom=92   lift the strip N px off the bottom edge (default 0), e.g.
                 to stack it directly above the existing commands ticker
-->
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body { font-family: Arial, Helvetica, sans-serif; }
  .ticker {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--bottom, 0px);
    height: 92px;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
    background: rgba(0,0,0,.78);
    border-top: 3px solid #ff9d00;
  }
  .track {
    display: flex;
    align-items: center;
    width: max-content;
    white-space: nowrap;
    will-change: transform;
    animation: scroll var(--duration, 30s) linear infinite;
  }
  .segment {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding-right: 70px;
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,.9);
  }
  .label { color: #ff9d00; font-weight: 900; }
  .sep { color: #ff9d00; font-weight: 900; }

  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-1 * var(--distance, 50%))); }
  }
</style>
</head>
<body>
  <div class="ticker" id="ticker">
    <div class="track" id="track">
      <div class="segment" id="segment">
        <span class="label">FOXBOT CASINO:</span>
        <span>!casinoflip heads 10</span>
        <span class="sep">|</span>
        <span>!casino</span>
        <span class="sep">|</span>
        <span>!roulette red 10</span>
        <span class="sep">|</span>
        <span>!crash 10 2.5</span>
        <span class="sep">|</span>
        <span>!blackjack 10 • !hit • !stand</span>
        <span class="sep">|</span>
        <span>!dice high 10</span>
        <span class="sep">|</span>
        <span>!slots 10</span>
        <span class="sep">||</span>
        <span class="label">FOXBOT:</span>
        <span>!foxhelp</span>
      </div>
    </div>
  </div>

<script>
  const ticker = document.getElementById('ticker');
  const track = document.getElementById('track');
  const segment = document.getElementById('segment');
  const params = new URLSearchParams(location.search);

  const speed = parseFloat(params.get('speed'));
  const pixelsPerSecond = (speed > 10 && speed < 1000) ? speed : 115;

  const bottom = parseInt(params.get('bottom'), 10);
  if (bottom >= 0 && bottom < 1000) ticker.style.setProperty('--bottom', bottom + 'px');

  function build() {
    // The casino list is shorter than the screen, so add copies until the
    // strip is always full, then scroll exactly one segment width so the
    // loop is seamless at a constant speed.
    while (track.children.length > 1) track.removeChild(track.lastChild);
    const distance = segment.getBoundingClientRect().width;
    const copies = Math.ceil(window.innerWidth / distance) + 1;
    for (let i = 0; i < copies; i++) {
      const clone = segment.cloneNode(true);
      clone.removeAttribute('id');
      track.appendChild(clone);
    }
    track.style.setProperty('--distance', distance + 'px');
    track.style.setProperty('--duration', (distance / pixelsPerSecond) + 's');
  }
  window.addEventListener('load', build);
  window.addEventListener('resize', build);
</script>
</body>
</html>
